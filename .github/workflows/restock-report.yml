name: Restock Report

on:
  schedule:
    # Monday and Thursday at 7:00 AM Eastern (12:00 UTC in summer, 11:00 UTC in winter)
    - cron: '0 11 * * 1,4'
  workflow_dispatch:   # manual trigger from Actions tab

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: Cache virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate and email restock report
        timeout-minutes: 5
        env:
          SANDSTAR_USERNAME: ${{ secrets.SANDSTAR_USERNAME }}
          SANDSTAR_PASSWORD_HASH: ${{ secrets.SANDSTAR_PASSWORD_HASH }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESTOCK_EMAIL_TO: ${{ secrets.RESTOCK_EMAIL_TO }}
        run: python restock_report.py --email
